<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Survival 2D - Juego</title>
    <link rel="stylesheet" href="landing/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b7425;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            margin: auto;
            min-width: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .c {
            position: relative;
            width: 1280px;
            height: 960px;
            margin: auto;
        }
        @media (max-width: 1600px) {
            .c {
                max-width: 960px;
                max-height: 720px;
            }
        }
        @media (max-width: 768px) {
            .c {
                max-width: 640px;
                max-height: 480px;
            }
        }
    </style>
</head>
<body>
    <div class="c">
        <canvas id="k" style="z-index: 1;" width="320" height="240"></canvas>
        <canvas id="t" style="z-index: 2;" width="1280" height="80"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
